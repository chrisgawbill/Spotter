<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Same-origin API example</title>
</head>
<body>
  <main aria-busy="true">
    <h1>Items</h1>
    <p id="status" role="status">Loading…</p>
    <ul id="items"></ul>
  </main>
  <script>
    // Relative calls: in development a dev-server proxy forwards /api to server.mjs.
    const getJson = async (path) => {
      const response = await fetch(path, { headers: { Accept: 'application/json' } });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return JSON.parse(await response.text());
    };
    Promise.all([getJson('/api/items'), getJson('/api/summary')])
      .then(([items, summary]) => {
        document.getElementById('items').replaceChildren(...items.map((item) => Object.assign(document.createElement('li'), { textContent: item.name })));
        document.getElementById('status').textContent = `${summary.count} items`;
      })
      .catch(() => { document.getElementById('status').textContent = "Couldn't load items"; })
      .finally(() => document.querySelector('main').removeAttribute('aria-busy'));
  </script>
</body>
</html>
